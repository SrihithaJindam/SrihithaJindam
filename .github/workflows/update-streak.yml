name: Update Streak Stats

on:
  schedule:
    - cron: "0 * * * *" # Runs every hour automatically
  workflow_dispatch:     # Allows manual instant update via Actions tab
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-streak.yml"

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest Streak Stats
        run: |
          mkdir -p assets
          curl -s "https://streak-stats.demolab.com?user=SrihithaJindam&theme=dark&ring=FF9800&fire=F44336&currStreakNum=FF9800&currStreakLabel=FFB74D&sideNums=FFB74D&sideLabels=FFCC80&dates=B0BEC5&hide_border=true&border_radius=10&date_format=M%20j%5B%2C%20Y%5D&timezone=Europe%2FBerlin&starting_year=2022" -o assets/streak-stats.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          if git diff --staged --quiet; then
            echo "No changes in streak stats"
          else
            git commit -m "Auto-update streak stats [skip ci]"
            git push
          fi
