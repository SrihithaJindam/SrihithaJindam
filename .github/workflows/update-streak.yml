name: Auto-Update Profile Graphs & Streaks

on:
  schedule:
    - cron: "*/30 * * * *" # Runs automatically every 30 minutes
  workflow_dispatch:        # Allows instant manual trigger anytime
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-streak.yml"
      - ".github/scripts/**"

permissions:
  contents: write

jobs:
  update-profile-graphs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Stats & Graph Updater
        run: |
          python .github/scripts/update_profile_stats.py

      - name: Commit and push if any graph changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "All graphs and streak stats are already up to date."
          else
            git commit -m "Auto-update profile graphs and streaks [skip ci]"
            git push
          fi
