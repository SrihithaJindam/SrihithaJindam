name: Auto-Update Profile Graphs & Streaks

on:
  schedule:
    # 12:00 PM (Afternoon - 10:00 UTC)
    - cron: "0 10 * * *"
    # 6:00 PM (18:00 Evening - 16:00 UTC)
    - cron: "0 16 * * *"
    # 10:00 PM (22:00 Night - 20:00 UTC)
    - cron: "0 20 * * *"
    # 11:50 PM (23:50 Night before midnight - 21:50 UTC Summer / 22:50 UTC Winter)
    - cron: "50 21 * * *"
    - cron: "50 22 * * *"
  workflow_dispatch:        # Allows instant manual trigger anytime
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-streak.yml"
      - ".github/scripts/**"

permissions:
  contents: write

jobs:
  update-profile-graphs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Stats & Graph Updater
        run: |
          python .github/scripts/update_profile_stats.py

      - name: Commit and push if any graph changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "All graphs and streak stats are already up to date."
          else
            git commit -m "Auto-update profile graphs and streaks [skip ci]"
            git push
          fi
