<svg xmlns="http://www.w3.org/2000/svg" width="700" height="200" viewBox="0 0 700 200">
    <defs>
        <linearGradient id="spiderOutline" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffeb3b" />
            <stop offset="50%" stop-color="#ff9800" />
            <stop offset="100%" stop-color="#f44336" />
        </linearGradient>
    </defs>
    <style>
        * {
            font-family: 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
        }
    </style>

    <!-- Card Background exactly matching profile-details card -->
    <rect x="1" y="1" rx="5" ry="5" width="99.7%" height="99%" fill="#151515" stroke="#000000" stroke-width="1" stroke-opacity="0" />

    <!-- Title on Left -->
    <text x="30" y="40" font-size="22px" font-weight="600" fill="#ffffff">Activity Radar</text>

    <!-- Stats breakdown on Left -->
    <g transform="translate(30, 60)">
        <!-- Commits -->
        <g transform="translate(0, 10)">
            <circle cx="5" cy="5" r="4" fill="#ff9800" />
            <text x="18" y="9" fill="#9f9f9f" font-size="13px">Total Commits:</text>
            <text x="160" y="9" fill="#ffffff" font-size="13px" font-weight="600">102</text>
        </g>
        <!-- PRs -->
        <g transform="translate(0, 32)">
            <circle cx="5" cy="5" r="4" fill="#ffb74d" />
            <text x="18" y="9" fill="#9f9f9f" font-size="13px">Pull Requests:</text>
            <text x="160" y="9" fill="#ffffff" font-size="13px" font-weight="600">32</text>
        </g>
        <!-- Issues -->
        <g transform="translate(0, 54)">
            <circle cx="5" cy="5" r="4" fill="#f44336" />
            <text x="18" y="9" fill="#9f9f9f" font-size="13px">Issues Opened:</text>
            <text x="160" y="9" fill="#ffffff" font-size="13px" font-weight="600">2</text>
        </g>
        <!-- Contributed Repos -->
        <g transform="translate(0, 76)">
            <circle cx="5" cy="5" r="4" fill="#ffeb3b" />
            <text x="18" y="9" fill="#9f9f9f" font-size="13px">Contributed Repos:</text>
            <text x="160" y="9" fill="#ffffff" font-size="13px" font-weight="600">15</text>
        </g>
        <!-- Code Reviews -->
        <g transform="translate(0, 98)">
            <circle cx="5" cy="5" r="4" fill="#ff7043" />
            <text x="18" y="9" fill="#9f9f9f" font-size="13px">Code Reviews:</text>
            <text x="160" y="9" fill="#ffffff" font-size="13px" font-weight="600">6</text>
        </g>
    </g>

    <!-- Radar Spider Grid on Right -->
    <g>
        <polygon points="495.0,88.8 510.5,100.0 504.6,118.1 485.4,118.1 479.5,100.0" fill="none" stroke="#22272e" stroke-width="1" stroke-dasharray="2,2" /><polygon points="495.0,72.5 525.9,95.0 514.1,131.3 475.9,131.3 464.1,95.0" fill="none" stroke="#22272e" stroke-width="1" stroke-dasharray="2,2" /><polygon points="495.0,56.2 541.4,89.9 523.7,144.4 466.3,144.4 448.6,89.9" fill="none" stroke="#22272e" stroke-width="1" stroke-dasharray="2,2" /><polygon points="495.0,40.0 556.8,84.9 533.2,157.6 456.8,157.6 433.2,84.9" fill="none" stroke="#30363d" stroke-width="1"  />
        <line x1="495" y1="105" x2="495.0" y2="40.0" stroke="#262c36" stroke-width="1" /><line x1="495" y1="105" x2="556.8" y2="84.9" stroke="#262c36" stroke-width="1" /><line x1="495" y1="105" x2="533.2" y2="157.6" stroke="#262c36" stroke-width="1" /><line x1="495" y1="105" x2="456.8" y2="157.6" stroke="#262c36" stroke-width="1" /><line x1="495" y1="105" x2="433.2" y2="84.9" stroke="#262c36" stroke-width="1" />
    </g>

    <!-- Color Outlined Graph (Soft transparent tint + crisp outline) -->
    <polygon points="495.0,46.5 539.5,90.5 517.9,136.6 479.0,127.1 475.2,98.6" fill="rgba(255, 152, 0, 0.08)" stroke="url(#spiderOutline)" stroke-width="2" stroke-linejoin="round" />
    
        <circle cx="495.0" cy="46.5" r="3.5" fill="#ff9800" stroke="#ffffff" stroke-width="1" />
        
        <circle cx="539.5" cy="90.5" r="3.5" fill="#ff9800" stroke="#ffffff" stroke-width="1" />
        
        <circle cx="517.9" cy="136.6" r="3.5" fill="#ff9800" stroke="#ffffff" stroke-width="1" />
        
        <circle cx="479.0" cy="127.1" r="3.5" fill="#ff9800" stroke="#ffffff" stroke-width="1" />
        
        <circle cx="475.2" cy="98.6" r="3.5" fill="#ff9800" stroke="#ffffff" stroke-width="1" />
        

    <!-- Labels around Radar -->
    <g>
        
        <text x="495.0" y="30.0" text-anchor="middle" fill="#ffb74d" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" font-size="10.5px" font-weight="600">
            Commits
        </text>
        
        <text x="573.1" y="81.2" text-anchor="start" fill="#ffb74d" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" font-size="10.5px" font-weight="600">
            PRs
        </text>
        
        <text x="544.0" y="167.3" text-anchor="start" fill="#ffb74d" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" font-size="10.5px" font-weight="600">
            Contributed
        </text>
        
        <text x="446.0" y="167.3" text-anchor="end" fill="#ffb74d" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" font-size="10.5px" font-weight="600">
            Reviews
        </text>
        
        <text x="416.9" y="81.2" text-anchor="end" fill="#ffb74d" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" font-size="10.5px" font-weight="600">
            Issues
        </text>
        
    </g>

    <!-- Radar Sub-caption -->
    <text x="495" y="190" text-anchor="middle" fill="#9f9f9f" font-size="10px">cross-repo activity</text>
</svg>
