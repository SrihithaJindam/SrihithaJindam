<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
    <defs>
        <linearGradient id="spiderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff9800" stop-opacity="0.6" />
            <stop offset="50%" stop-color="#f44336" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#ffeb3b" stop-opacity="0.3" />
        </linearGradient>
        <filter id="spiderGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffeb3b" />
            <stop offset="50%" stop-color="#ff9800" />
            <stop offset="100%" stop-color="#f44336" />
        </linearGradient>
    </defs>

    <!-- Card Background -->
    <rect x="1" y="1" width="638" height="358" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />

    <!-- Title Header -->
    <g transform="translate(25, 32)">
        <text fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16px" font-weight="700">
            🕸️ Activity &amp; Contribution Radar
        </text>
        <text y="18" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5px">
            Cross-repository distribution: Commits, Pull Requests, Issues, and Reviews
        </text>
    </g>

    <!-- Spider Grid Lines & Web -->
    <g>
        <polygon points="320.0,166.2 347.3,186.1 336.9,218.3 303.1,218.3 292.7,186.1" fill="none" stroke="#21262d" stroke-width="1.2" stroke-dasharray="3,3" /><polygon points="320.0,137.5 374.7,177.2 353.8,241.5 286.2,241.5 265.3,177.2" fill="none" stroke="#21262d" stroke-width="1.2" stroke-dasharray="3,3" /><polygon points="320.0,108.8 402.0,168.3 370.7,264.8 269.3,264.8 238.0,168.3" fill="none" stroke="#21262d" stroke-width="1.2" stroke-dasharray="3,3" /><polygon points="320.0,80.0 429.4,159.5 387.6,288.0 252.4,288.0 210.6,159.5" fill="none" stroke="#30363d" stroke-width="1.2"  />
        <line x1="320" y1="195" x2="320.0" y2="80.0" stroke="#30363d" stroke-width="1.5" /><line x1="320" y1="195" x2="429.4" y2="159.5" stroke="#30363d" stroke-width="1.5" /><line x1="320" y1="195" x2="387.6" y2="288.0" stroke="#30363d" stroke-width="1.5" /><line x1="320" y1="195" x2="252.4" y2="288.0" stroke="#30363d" stroke-width="1.5" /><line x1="320" y1="195" x2="210.6" y2="159.5" stroke="#30363d" stroke-width="1.5" />
    </g>

    <!-- Glowing Polygon Area -->
    <polygon points="320.0,93.8 398.7,169.4 359.2,249.0 293.0,232.2 287.2,184.3" fill="url(#spiderGradient)" stroke="#ff9800" stroke-width="2.2" filter="url(#spiderGlow)" />
    
        <circle cx="320.0" cy="93.8" r="5" fill="#f44336" stroke="#ffffff" stroke-width="1.5">
            <animate attributeName="r" values="4.5;6;4.5" dur="2.5s" repeatCount="indefinite" />
        </circle>
        
        <circle cx="398.7" cy="169.4" r="5" fill="#f44336" stroke="#ffffff" stroke-width="1.5">
            <animate attributeName="r" values="4.5;6;4.5" dur="2.5s" repeatCount="indefinite" />
        </circle>
        
        <circle cx="359.2" cy="249.0" r="5" fill="#f44336" stroke="#ffffff" stroke-width="1.5">
            <animate attributeName="r" values="4.5;6;4.5" dur="2.5s" repeatCount="indefinite" />
        </circle>
        
        <circle cx="293.0" cy="232.2" r="5" fill="#f44336" stroke="#ffffff" stroke-width="1.5">
            <animate attributeName="r" values="4.5;6;4.5" dur="2.5s" repeatCount="indefinite" />
        </circle>
        
        <circle cx="287.2" cy="184.3" r="5" fill="#f44336" stroke="#ffffff" stroke-width="1.5">
            <animate attributeName="r" values="4.5;6;4.5" dur="2.5s" repeatCount="indefinite" />
        </circle>
        

    <!-- Category Labels -->
    <g>
        
        <text x="320.0" y="60.0" text-anchor="middle" fill="#ffb74d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px" font-weight="600">
            Commits (102)
        </text>
        
        <text x="464.0" y="153.3" text-anchor="start" fill="#ffb74d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px" font-weight="600">
            PRs (32)
        </text>
        
        <text x="412.1" y="304.2" text-anchor="start" fill="#ffb74d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px" font-weight="600">
            Contributed Repos (15)
        </text>
        
        <text x="227.9" y="304.2" text-anchor="end" fill="#ffb74d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px" font-weight="600">
            Code Reviews (6)
        </text>
        
        <text x="176.0" y="153.3" text-anchor="end" fill="#ffb74d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13px" font-weight="600">
            Issues (2)
        </text>
        
    </g>
</svg>
