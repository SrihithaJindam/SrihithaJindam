<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220">
    <defs>
        <linearGradient id="spiderOutline" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffeb3b" />
            <stop offset="50%" stop-color="#ff9800" />
            <stop offset="100%" stop-color="#f44336" />
        </linearGradient>
    </defs>
    <style>
        * {
            font-family: 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
        }
    </style>

    <!-- Card Background -->
    <rect x="1" y="1" rx="6" ry="6" width="99.7%" height="99%" fill="#151515" stroke="#262c36" stroke-width="1" />

    <!-- Left Header -->
    <text x="35" y="38" font-size="20px" font-weight="700" fill="#ffffff">Activity Radar</text>
    <text x="35" y="56" font-size="11px" fill="#8b949e">Cross-repository contribution distribution</text>

    <!-- Stats Breakdown on Left -->
    <g transform="translate(35, 70)">
        <!-- Commits -->
        <g transform="translate(0, 10)">
            <circle cx="5" cy="5" r="4" fill="#ff9800" />
            <text x="18" y="9" fill="#9f9f9f" font-size="13px">Total Commits:</text>
            <text x="155" y="9" fill="#ffffff" font-size="13px" font-weight="600">122</text>
        </g>
        <!-- PRs -->
        <g transform="translate(0, 34)">
            <circle cx="5" cy="5" r="4" fill="#ffb74d" />
            <text x="18" y="9" fill="#9f9f9f" font-size="13px">Pull Requests:</text>
            <text x="155" y="9" fill="#ffffff" font-size="13px" font-weight="600">32</text>
        </g>
        <!-- Issues -->
        <g transform="translate(0, 58)">
            <circle cx="5" cy="5" r="4" fill="#f44336" />
            <text x="18" y="9" fill="#9f9f9f" font-size="13px">Issues Opened:</text>
            <text x="155" y="9" fill="#ffffff" font-size="13px" font-weight="600">2</text>
        </g>
        <!-- Contributed Repos -->
        <g transform="translate(0, 82)">
            <circle cx="5" cy="5" r="4" fill="#ffeb3b" />
            <text x="18" y="9" fill="#9f9f9f" font-size="13px">Contributed Repos:</text>
            <text x="155" y="9" fill="#ffffff" font-size="13px" font-weight="600">17</text>
        </g>
        <!-- Code Reviews -->
        <g transform="translate(0, 106)">
            <circle cx="5" cy="5" r="4" fill="#ff7043" />
            <text x="18" y="9" fill="#9f9f9f" font-size="13px">Code Reviews:</text>
            <text x="155" y="9" fill="#ffffff" font-size="13px" font-weight="600">6</text>
        </g>
    </g>

    <!-- Subtle Center Divider -->
    <line x1="255" y1="25" x2="255" y2="195" stroke="#22272e" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Radar Spider Grid on Right -->
    <g>
        <polygon points="485.0,97.0 501.2,108.7 495.0,127.8 475.0,127.8 468.8,108.7" fill="none" stroke="#22272e" stroke-width="1" stroke-dasharray="2.5,2.5" /><polygon points="485.0,80.0 517.3,103.5 505.0,141.5 465.0,141.5 452.7,103.5" fill="none" stroke="#22272e" stroke-width="1" stroke-dasharray="2.5,2.5" /><polygon points="485.0,63.0 533.5,98.2 515.0,155.3 455.0,155.3 436.5,98.2" fill="none" stroke="#22272e" stroke-width="1" stroke-dasharray="2.5,2.5" /><polygon points="485.0,46.0 549.7,93.0 525.0,169.0 445.0,169.0 420.3,93.0" fill="none" stroke="#30363d" stroke-width="1"  />
        <line x1="485" y1="114" x2="485.0" y2="46.0" stroke="#282f38" stroke-width="1.2" /><line x1="485" y1="114" x2="549.7" y2="93.0" stroke="#282f38" stroke-width="1.2" /><line x1="485" y1="114" x2="525.0" y2="169.0" stroke="#282f38" stroke-width="1.2" /><line x1="485" y1="114" x2="445.0" y2="169.0" stroke="#282f38" stroke-width="1.2" /><line x1="485" y1="114" x2="420.3" y2="93.0" stroke="#282f38" stroke-width="1.2" />
    </g>

    <!-- Color Outlined Graph (Soft transparent tint + crisp outline) -->
    <polygon points="485.0,52.8 531.6,98.9 509.8,148.1 468.2,137.1 464.3,107.3" fill="rgba(255, 152, 0, 0.06)" stroke="url(#spiderOutline)" stroke-width="2.2" stroke-linejoin="round" />
    
        <circle cx="485.0" cy="52.8" r="4" fill="#ff9800" stroke="#ffffff" stroke-width="1.2" />
        
        <circle cx="531.6" cy="98.9" r="4" fill="#ff9800" stroke="#ffffff" stroke-width="1.2" />
        
        <circle cx="509.8" cy="148.1" r="4" fill="#ff9800" stroke="#ffffff" stroke-width="1.2" />
        
        <circle cx="468.2" cy="137.1" r="4" fill="#ff9800" stroke="#ffffff" stroke-width="1.2" />
        
        <circle cx="464.3" cy="107.3" r="4" fill="#ff9800" stroke="#ffffff" stroke-width="1.2" />
        

    <!-- Labels around Radar -->
    <g>
        
        <text x="485.0" y="34.0" text-anchor="middle" fill="#ffb74d" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" font-size="11px" font-weight="600">
            Commits (122)
        </text>
        
        <text x="566.9" y="88.7" text-anchor="start" fill="#ffb74d" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" font-size="11px" font-weight="600">
            PRs (32)
        </text>
        
        <text x="536.4" y="180.3" text-anchor="start" fill="#ffb74d" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" font-size="11px" font-weight="600">
            Contributed (17)
        </text>
        
        <text x="433.6" y="180.3" text-anchor="end" fill="#ffb74d" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" font-size="11px" font-weight="600">
            Reviews (6)
        </text>
        
        <text x="403.1" y="88.7" text-anchor="end" fill="#ffb74d" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" font-size="11px" font-weight="600">
            Issues (2)
        </text>
        
    </g>

    <!-- Radar Sub-caption -->
    <text x="485" y="206" text-anchor="middle" fill="#8b949e" font-size="10px">multi-dimensional contribution footprint</text>
</svg>
